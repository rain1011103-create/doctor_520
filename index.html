<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>醫生抽獎系統</title>
  <style>
    :root {
      --primary: #f43f5e;
      --primary-hover: #e11d48;
      --bg: #f8fafc;
      --text: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      margin: 0;
    }
    .wrapper {
      width: 100%;
      max-width: 800px;
    }
    /* 頂部橫幅設定 */
    .banner-container {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #fff;
    }
    .banner-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    .container {
      background: white;
      width: 100%;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      box-sizing: border-box;
    }
    .left-panel {
      flex: 1;
      min-width: 250px;
    }
    .right-panel {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-top: 0;
      color: var(--primary);
      font-size: 24px;
    }
    label { font-weight: bold; display: block; margin-bottom: 8px; }
    textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
    }
    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }
    button:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    .wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 20px auto;
    }
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #334155;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
    }
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 35px solid var(--primary);
      z-index: 10;
      filter: drop-shadow(0 4px 2px rgba(0,0,0,0.3));
    }
    .winner-text {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary);
      min-height: 36px;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- 頂部橫幅圖片 -->
    <div class="banner-container">
      <img src="banner.png" alt="醫生抽獎系統橫幅" class="banner-img" id="bannerImg" onerror="this.style.display='none'">
    </div>

    <div class="container">
      <div class="left-panel">
        <h1>醫生抽獎系統</h1>
        <label>參加名單（每行一位）：</label>
        <textarea id="nameList" rows="8">小明
小華
小美
阿強
小玲
阿輝</textarea>
        <button id="updateBtn" onclick="drawWheel()" style="background-color: #3b82f6;">更新轉盤名單</button>
        
        <div style="margin-top: 30px; background: #f1f5f9; padding: 15px; border-radius: 8px;">
          <label>中獎名單紀錄</label>
          <ul id="winnerList" style="margin: 0; padding-left: 20px;"></ul>
        </div>
      </div>

      <div class="right-panel">
        <div class="wheel-container">
          <div class="pointer"></div>
          <canvas id="wheelCanvas" width="300" height="300" class="wheel"></canvas>
        </div>
        <button id="spinBtn" onclick="spinWheel()" style="width: 200px;">開始旋轉</button>
        <div class="winner-text" id="winnerText">準備就緒</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const radius = canvas.width / 2;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    
    let candidates = [];
    let currentRotation = 0;
    let isSpinning = false;
    
    const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#f472b6', '#fb923c', '#38bdf8'];

    function getCandidates() {
      const text = document.getElementById('nameList').value.trim();
      if (!text) return [];
      return text.split('\n').map(name => name.trim()).filter(name => name.length > 0);
    }

    function drawWheel() {
      candidates = getCandidates();
      if (candidates.length === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      const sliceAngle = (2 * Math.PI) / candidates.length;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      candidates.forEach((name, i) => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, i * sliceAngle, (i + 1) * sliceAngle);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(i * sliceAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        let displayName = name.length > 6 ? name.substring(0, 5) + '..' : name;
        ctx.fillText(displayName, radius - 15, 6);
        ctx.restore();
      });
      
      ctx.beginPath();
      ctx.arc(centerX, centerY, 15, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    function spinWheel() {
      candidates = getCandidates();
      if (candidates.length < 2) {
        alert('請至少輸入兩位參加者！');
        return;
      }
      if (isSpinning) return;

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('winnerText').innerText = '旋轉中...';

      const spinDegrees = Math.random() * 360 + 1800; 
      currentRotation += spinDegrees;

      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        const sliceAngle = 360 / candidates.length;
        const normalizedRotation = currentRotation % 360;
        const winningAngle = (360 - normalizedRotation + 270) % 360; 
        
        const winningIndex = Math.floor(winningAngle / sliceAngle);
        const winner = candidates[winningIndex];

        document.getElementById('winnerText').innerText = `恭喜中獎者：${winner}`;
        
        const list = document.getElementById('winnerList');
        const li = document.createElement('li');
        li.innerText = winner;
        list.appendChild(li);

        candidates.splice(winningIndex, 1);
        document.getElementById('nameList').value = candidates.join('\n');
        
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;
        
        setTimeout(() => {
           canvas.style.transition = 'none';
           currentRotation = 0;
           canvas.style.transform = `rotate(0deg)`;
           drawWheel();
           setTimeout(() => canvas.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)', 50);
        }, 2000);

      }, 4000);
    }

    drawWheel();
  </script>

</body>
</html>
