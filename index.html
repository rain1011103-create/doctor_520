<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>醫生抽獎系統</title>
  <style>
    * { box-sizing: border-box; }
    
    /* 滿版 PNG 圖片背景設定 */
    body {
      margin: 0;
      padding: 20px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: url('background.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 四角微橢圓橫幅 */
    .banner-container {
      width: calc(100% - 40px);
      max-width: 900px;
      margin: 10px auto 20px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      border: 4px solid rgba(255, 255, 255, 0.9);
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      transition: transform 0.3s ease;
    }
    .banner-container:hover {
      transform: translateY(-2px);
    }
    .banner-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 24px;
    }

    /* 修正對齊問題的分頁導覽列 */
    .nav-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 10px 0 20px;
    }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 36px;
      font-size: 16px;
      font-weight: bold;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #4a5568;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.25s ease;
      outline: none;
      box-sizing: border-box;
    }
    .tab-btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #ff5e62 0%, #ff9966 100%);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(255, 94, 98, 0.4);
    }

    /* 主卡片面板 */
    .view-panel {
      display: none;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      padding: 35px;
      border-radius: 28px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
      max-width: 900px;
      width: calc(100% - 40px);
      margin-bottom: 25px;
    }
    .view-panel.active { display: block; }

    /* 設定頁面樣式 */
    .setting-title {
      font-size: 22px;
      font-weight: bold;
      color: #2b3a4a;
      margin-bottom: 12px;
    }
    textarea {
      width: 100%;
      height: 260px;
      border: 2px solid rgba(233, 30, 99, 0.3);
      border-radius: 16px;
      padding: 16px;
      font-size: 15px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.9);
      transition: border-color 0.3s ease;
    }
    textarea:focus {
      border-color: #ff5e62;
    }
    .btn-action {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 14px 35px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    /* 抽獎舞台頁面 */
    .stage-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .stage-info {
      font-size: 19px;
      font-weight: bold;
      color: #2b3a4a;
      margin-bottom: 15px;
    }

    /* 抽獎人數控制區 */
    .count-selector-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(233, 30, 99, 0.2);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }
    .count-selector-container label {
      font-weight: bold;
      color: #d81b60;
      font-size: 15px;
    }
    .count-input {
      width: 75px;
      padding: 6px 10px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      border: 2px solid #ff5e62;
      border-radius: 10px;
      outline: none;
      color: #d81b60;
      background: #ffffff;
    }

    /* 紫色背景滾輪 */
    .slot-display {
      width: 100%;
      max-width: 700px;
      height: 200px;
      background: linear-gradient(135deg, #2a0845, #4a154b, #6b21a8);
      border: 4px solid #f9d423;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(74, 21, 75, 0.4), inset 0 0 15px rgba(249, 212, 35, 0.3);
      position: relative;
      overflow: hidden;
    }

    .slot-name {
      font-size: 56px;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow: 0 0 25px rgba(255, 235, 59, 0.9), 0 0 12px rgba(255, 193, 7, 0.7);
      letter-spacing: 2px;
    }

    /* 抽獎按鈕 */
    .btn-spin-large {
      margin-top: 30px;
      background: linear-gradient(135deg, #ff5e62 0%, #ff9966 100%);
      color: white;
      border: none;
      padding: 18px 75px;
      border-radius: 40px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 94, 98, 0.35);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .btn-spin-large:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 14px 30px rgba(255, 94, 98, 0.45);
    }
    .btn-spin-large:active {
      transform: translateY(-1px) scale(0.99);
    }
    .btn-spin-large:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 中獎紀錄卡片 */
    .history-card {
      margin-top: 30px;
      width: 100%;
      max-width: 700px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid rgba(233, 30, 99, 0.2);
      text-align: left;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-card h4 { margin: 0; color: #d81b60; font-size: 16px; font-weight: bold; }
    .btn-clear-history {
      background-color: #ffffff;
      color: #d81b60;
      border: 1px solid rgba(233, 30, 99, 0.3);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-clear-history:hover {
      background-color: #fff0f5;
      border-color: #d81b60;
    }
    .history-items {
      max-height: 150px;
      overflow-y: auto;
      font-size: 14px;
      color: #334155;
      line-height: 1.8;
    }

    /* 底部警語 */
    .footer-disclaimer {
      width: calc(100% - 40px);
      max-width: 900px;
      margin: 10px auto 25px;
      text-align: center;
      padding: 18px 20px;
      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px dashed #f48fb1;
      border-radius: 20px;
      color: #880e4f;
      font-size: 13px;
      line-height: 1.8;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }
    .footer-disclaimer .disclaimer-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
      color: #ad1457;
    }

    /* 中獎彈窗 */
    .winner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .winner-modal.show { display: flex; }
    .modal-content {
      background: #ffffff;
      padding: 40px 45px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .modal-winner-container {
      margin: 20px 0;
      overflow-y: auto;
      max-height: 45vh;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      padding: 5px;
    }
    .modal-winner-badge {
      background: linear-gradient(135deg, #fff0f5, #f8bbd0);
      color: #c2185b;
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 24px;
      font-weight: 900;
      border: 2px solid #ff5e62;
      box-shadow: 0 6px 15px rgba(233, 30, 99, 0.15);
    }
    .modal-close-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 12px 40px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      align-self: center;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }
    .modal-close-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>

  <!-- 四角微橢圓橫幅 -->
  <header class="banner-container">
    <img src="./banner.png" alt="醫生抽獎系統橫幅">
  </header>

  <!-- 分頁切換區（完全垂直對齊） -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('stage')">抽獎舞台</button>
    <button class="tab-btn" onclick="switchTab('settings')">名單與設定</button>
  </div>

  <!-- 分頁 1：抽獎舞台 -->
  <div id="stagePanel" class="view-panel active">
    <div class="stage-container">
      <div class="stage-info" id="stageInfo">目前名單：共 0 位</div>

      <!-- 每次抽取人數設定 -->
      <div class="count-selector-container">
        <label for="drawCount">每次抽出人數：</label>
        <input type="number" id="drawCount" class="count-input" value="1" min="1" max="1">
        <span style="color: #666; font-size: 14px; font-weight: bold;">位</span>
      </div>

      <!-- 紫色背景 + 亮黃字體滾輪 -->
      <div class="slot-display">
        <div class="slot-name" id="slotName">請先設定名單</div>
      </div>

      <button class="btn-spin-large" id="spinBtn" onclick="startHugeLottery()">開始抽獎</button>

      <!-- 中獎紀錄 -->
      <div class="history-card">
        <div class="history-header">
          <h4>中獎紀錄清單</h4>
          <button class="btn-clear-history" onclick="clearHistory()">重新整理 / 清除紀錄</button>
        </div>
        <div class="history-items" id="historyList">尚無中獎紀錄</div>
      </div>
    </div>
  </div>

  <!-- 分頁 2：名單設定 -->
  <div id="settingsPanel" class="view-panel">
    <div class="setting-title">參加名單管理</div>
    <p style="color: #555; font-size: 14px; margin-top: -5px;">請在下方貼上或輸入抽獎名單，一行一位：</p>
    <textarea id="nameInput" placeholder="請在此輸入名單"></textarea>
    <br>
    <button class="btn-action" onclick="saveNames()">儲存名單並更新</button>
  </div>

  <!-- 底部警語 -->
  <footer class="footer-disclaimer">
    <div class="disclaimer-title">版權聲明與使用規範</div>
    <div>本系統之所有設計、介面版型、視覺素材及程式原始碼均受著作權法保護。</div>
    <div>嚴禁任何形式之未授權抄襲、轉載、重製、二次搬運或作為商業營利用途，違者將依法追究相關法律責任。</div>
  </footer>

  <!-- 中獎彈窗 -->
  <div class="winner-modal" id="winnerModal">
    <div class="modal-content">
      <h2 style="margin: 0; color: #475569; font-size: 22px;" id="modalTitle">恭喜中獎幸運兒</h2>
      <div class="modal-winner-container" id="modalWinnerContainer"></div>
      <button class="modal-close-btn" onclick="closeModal()">確認</button>
    </div>
  </div>

  <script>
    let names = [];
    let isSpinning = false;

    // 初始化：預設空白
    document.getElementById("nameInput").value = "";
    saveNames(false);

    function switchTab(tab) {
      if (isSpinning) return;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));

      if (tab === 'stage') {
        document.querySelectorAll(".tab-btn")[0].classList.add("active");
        document.getElementById("stagePanel").classList.add("active");
      } else {
        document.querySelectorAll(".tab-btn")[1].classList.add("active");
        document.getElementById("settingsPanel").classList.add("active");
      }
    }

    function saveNames(showAlert = true) {
      const text = document.getElementById("nameInput").value.trim();
      names = text ? text.split("\n").map(n => n.trim()).filter(n => n.length > 0) : [];
      
      document.getElementById("stageInfo").innerText = `目前名單：共 ${names.length} 位`;
      
      const slotName = document.getElementById("slotName");
      if (names.length === 0) {
        slotName.innerText = "請先設定名單";
      } else {
        slotName.innerText = "準備抽獎";
      }
      
      const drawCountInput = document.getElementById("drawCount");
      drawCountInput.max = names.length > 0 ? names.length : 1;

      if (showAlert) {
        alert(`名單更新成功，目前共有 ${names.length} 位參與抽獎。`);
        switchTab('stage');
      }
    }

    // 動態計算抽獎時間與滾動速度
    function startHugeLottery() {
      if (isSpinning) return;

      if (names.length === 0) {
        alert("目前名單內沒有參與者，請先至「名單與設定」輸入名單！");
        switchTab('settings');
        return;
      }

      const drawCountInput = document.getElementById("drawCount");
      let count = parseInt(drawCountInput.value, 10);
      if (isNaN(count) || count < 1) count = 1;
      if (count > names.length) count = names.length;

      isSpinning = true;
      const spinBtn = document.getElementById("spinBtn");
      const slotName = document.getElementById("slotName");
      spinBtn.disabled = true;

      // 依人數動態調整總動畫時間 (毫秒)
      const totalCount = names.length;
      let totalDuration = 4000; 

      if (totalCount <= 5) {
        totalDuration = 2500; // 人少：快速抽出
      } else if (totalCount <= 20) {
        totalDuration = 4000; // 人數適中：標準時間
      } else {
        totalDuration = 5500; // 人多：拉長懸念時間
      }

      let speed = 40;
      let elapsed = 0;

      const runAnimation = () => {
        const randomIndex = Math.floor(Math.random() * names.length);
        slotName.innerText = names[randomIndex];
        elapsed += speed;

        // 隨時間推移漸漸減速 (模擬真實滾輪)
        if (elapsed > totalDuration * 0.7) {
          speed += 15;
        }

        if (elapsed < totalDuration) {
          setTimeout(runAnimation, speed);
        } else {
          // 動畫結束，抽出得獎者
          const shuffled = [...names].sort(() => 0.5 - Math.random());
          const winners = shuffled.slice(0, count);

          if (count === 1) {
            slotName.innerText = winners[0];
          } else {
            slotName.innerText = `抽出 ${count} 位幸運兒`;
          }

          showWinnersModal(winners);
          recordHistory(winners);

          isSpinning = false;
          spinBtn.disabled = false;
        }
      };

      runAnimation();
    }

    // 彈出中獎視窗
    function showWinnersModal(winners) {
      const container = document.getElementById("modalWinnerContainer");
      const title = document.getElementById("modalTitle");
      container.innerHTML = "";

      title.innerText = winners.length > 1 ? `恭喜 ${winners.length} 位中獎幸運兒` : `恭喜中獎幸運兒`;

      winners.forEach(winner => {
        const badge = document.createElement("div");
        badge.className = "modal-winner-badge";
        badge.innerText = winner;
        container.appendChild(badge);
      });

      document.getElementById("winnerModal").classList.add("show");
    }

    function closeModal() {
      document.getElementById("winnerModal").classList.remove("show");
    }

    // 寫入中獎紀錄
    function recordHistory(winners) {
      const historyList = document.getElementById("historyList");
      if (historyList.innerText === "尚無中獎紀錄") {
        historyList.innerHTML = "";
      }
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const winnersText = winners.join("、");
      historyList.innerHTML = `<div>• [${time}] <b>${winnersText}</b></div>` + historyList.innerHTML;
    }

    // 清除紀錄
    function clearHistory() {
      if (confirm("確定要清除所有中獎紀錄嗎？")) {
        document.getElementById("historyList").innerHTML = "尚無中獎紀錄";
      }
    }
  </script>
</body>
</html>
