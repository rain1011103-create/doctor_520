<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>醫生抽獎系統</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: #f7f9fb;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂部橫幅區塊 */
    .banner-container {
      width: 100%;
      background-color: #fff;
      display: flex;
      justify-content: center;
      border-bottom: 1px solid #eef0f2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .banner-container img {
      width: 100%;
      max-width: 850px;
      height: auto;
      display: block;
    }

    /* 主卡片容器 */
    .main-card {
      background: #ffffff;
      margin: 25px 15px 40px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      max-width: 850px;
      width: calc(100% - 30px);
    }

    .system-title {
      color: #ff3366;
      margin: 0 0 20px 0;
      font-size: 22px;
      font-weight: bold;
    }

    .layout-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: space-between;
    }

    /* 左側輸入區 */
    .input-section {
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-section label {
      font-weight: bold;
      color: #333;
      font-size: 15px;
    }

    textarea {
      width: 100%;
      height: 160px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border 0.2s;
    }

    textarea:focus {
      border-color: #3b82f6;
    }

    .btn-update {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-update:hover {
      background-color: #2563eb;
    }

    .history-box {
      margin-top: 10px;
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #e2e8f0;
      max-height: 120px;
      overflow-y: auto;
      font-size: 13px;
      color: #475569;
    }

    .history-title {
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 6px;
    }

    /* 右側轉盤區 */
    .wheel-section {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .wheel-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ff3366;
      z-index: 10;
    }

    #wheelCanvas {
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1);
    }

    .btn-spin {
      margin-top: 20px;
      background-color: #ff3366;
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 51, 102, 0.3);
      transition: 0.2s;
    }

    .btn-spin:hover {
      background-color: #e62054;
      transform: scale(1.03);
    }

    .btn-spin:disabled {
      background-color: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .status-text {
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #ff3366;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <!-- 頂端橫幅（使用相對路徑） -->
  <header class="banner-container">
    <img src="./banner.png" alt="醫生抽獎系統橫幅">
  </header>

  <div class="main-card">
    <div class="system-title">醫生抽獎系統</div>
    
    <div class="layout-grid">
      <!-- 左側自訂名單 -->
      <div class="input-section">
        <label for="nameInput">參加名單（每行一位）：</label>
        <textarea id="nameInput">小明
小華
小美
阿強
小玲
阿輝</textarea>
        <button class="btn-update" onclick="updateList()">更新轉盤名單</button>
        
        <div class="history-box">
          <div class="history-title">中獎名單紀錄</div>
          <div id="historyList">尚無抽獎紀錄</div>
        </div>
      </div>

      <!-- 右側轉盤 -->
      <div class="wheel-section">
        <div class="wheel-wrapper">
          <div class="pointer"></div>
          <canvas id="wheelCanvas" width="280" height="280"></canvas>
        </div>
        <button class="btn-spin" id="spinBtn" onclick="startSpin()">開始旋轉</button>
        <div class="status-text" id="statusText">準備就緒</div>
      </div>
    </div>
  </div>

  <script>
    const colors = [
      "#ff7675", "#fd79a8", "#a29bfe", "#74b9ff",
      "#55efc4", "#ffeaa7", "#fab1a0", "#81ecec"
    ];

    let names = [];
    let currentRotation = 0;
    let isSpinning = false;

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const statusText = document.getElementById("statusText");
    const historyList = document.getElementById("historyList");
    const nameInput = document.getElementById("nameInput");

    function updateList() {
      if (isSpinning) return;
      const text = nameInput.value.trim();
      names = text.split("\n").map(n => n.trim()).filter(n => n.length > 0);

      if (names.length < 2) {
        alert("請至少輸入 2 個名單項目！");
        return;
      }
      drawWheel();
      statusText.innerText = "名單已更新，隨時可抽獎！";
    }

    function drawWheel() {
      const numSegments = names.length;
      const arcSize = (2 * Math.PI) / numSegments;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSegments; i++) {
        const angle = i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arcSize);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,0.3)";
        ctx.shadowBlur = 4;
        ctx.font = "bold 15px sans-serif";
        ctx.translate(radius, radius);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillText(names[i], radius - 20, 5);
        ctx.restore();
      }
    }

    function startSpin() {
      if (isSpinning || names.length < 2) return;
      
      isSpinning = true;
      spinBtn.disabled = true;
      statusText.innerText = "抽獎中...";

      const winningIndex = Math.floor(Math.random() * names.length);
      const segmentDeg = 360 / names.length;
      const targetDeg = 270 - (winningIndex * segmentDeg + segmentDeg / 2);
      const extraRotations = 360 * 6; // 額外轉 6 圈

      currentRotation += extraRotations + ((targetDeg - (currentRotation % 360) + 360) % 360);
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;
        const winner = names[winningIndex];
        statusText.innerText = `🎉 恭喜中獎：${winner}`;

        // 寫入中獎紀錄
        if (historyList.innerText === "尚無抽獎紀錄") {
          historyList.innerHTML = "";
        }
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        historyList.innerHTML = `<div>• [${time}] <b>${winner}</b></div>` + historyList.innerHTML;
      }, 4000);
    }

    // 初始化啟動
    updateList();
  </script>
</body>
</html>
