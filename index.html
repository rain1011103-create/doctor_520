<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上抽獎系統</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }
    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 550px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    h1 {
      text-align: center;
      margin-top: 0;
      color: var(--primary);
    }
    .box {
      margin-bottom: 20px;
    }
    .row {
      display: flex;
      gap: 15px;
    }
    .row .box {
      flex: 1;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    textarea, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    textarea:focus, input:focus {
      border-color: var(--primary);
    }
    .lottery-screen {
      background: #0f172a;
      color: #38bdf8;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      padding: 25px 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.5;
      white-space: pre-line;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .winner-board {
      margin-top: 25px;
      background: #f1f5f9;
      padding: 15px;
      border-radius: 8px;
    }
    .winner-board h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }
    .winner-list {
      margin: 0;
      padding-left: 20px;
    }
    .winner-list li {
      margin-bottom: 6px;
      font-weight: 500;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎁 幸運抽獎系統</h1>

    <div class="box">
      <label>名單輸入（每行一個人名 / 編號）：</label>
      <textarea id="nameList" rows="5" placeholder="例如：
小明
小華
小美
阿強
小玲"></textarea>
    </div>

    <div class="row">
      <div class="box">
        <label>獎項名稱：</label>
        <input type="text" id="prizeName" value="幸運大獎">
      </div>
      <div class="box" style="max-width: 120px;">
        <label>抽取人數：</label>
        <input type="number" id="drawCount" min="1" value="1">
      </div>
    </div>

    <!-- 抽獎動態展示區 -->
    <div class="lottery-screen" id="screen">準備就緒</div>

    <div class="btn-group">
      <button id="drawBtn" onclick="startLottery()">開始抽獎</button>
      <button style="background-color: #64748b;" onclick="clearWinners()">清空中獎紀錄</button>
    </div>

    <!-- 中獎名單 -->
    <div class="winner-board">
      <h3>🏆 中獎名單紀錄</h3>
      <ol class="winner-list" id="winnerList"></ol>
    </div>
  </div>

  <script>
    let isDrawing = false;

    function getCandidates() {
      const text = document.getElementById('nameList').value.trim();
      if (!text) return [];
      return text.split('\n').map(name => name.trim()).filter(name => name.length > 0);
    }

    function startLottery() {
      if (isDrawing) return;

      const candidates = getCandidates();
      const countInput = document.getElementById('drawCount');
      const count = parseInt(countInput.value, 10) || 1;

      if (candidates.length === 0) {
        alert('請先在名單欄位中輸入至少一位參與者！');
        return;
      }

      if (count <= 0) {
        alert('抽取人數必須大於 0！');
        return;
      }

      if (count > candidates.length) {
        alert(`抽獎人數（${count} 人）不能大於目前名單總人數（${candidates.length} 人）！`);
        return;
      }

      isDrawing = true;
      const screen = document.getElementById('screen');
      const drawBtn = document.getElementById('drawBtn');
      const prizeName = document.getElementById('prizeName').value || '幸運獎';
      drawBtn.disabled = true;

      // 跑馬燈滾動效果
      let counter = 0;
      const totalRolls = 25;
      const interval = setInterval(() => {
        // 隨機挑出 count 個假名單滾動
        const tempShuffled = [...candidates].sort(() => 0.5 - Math.random());
        const tempDisplay = tempShuffled.slice(0, count).join('、');
        screen.innerText = tempDisplay;
        counter++;

        if (counter >= totalRolls) {
          clearInterval(interval);

          // 決定最終抽出的一組得獎者
          const winners = [];
          for (let i = 0; i < count; i++) {
            const randomIndex = Math.floor(Math.random() * candidates.length);
            winners.push(candidates.splice(randomIndex, 1)[0]);
          }

          // 顯示得獎畫面
          screen.innerText = `🎉 中獎者：\n${winners.join('、')}`;

          // 新增到下方歷史清單
          const list = document.getElementById('winnerList');
          winners.forEach(winner => {
            const li = document.createElement('li');
            li.innerText = `【${prizeName}】: ${winner}`;
            list.appendChild(li);
          });

          // 自動從輸入框移除已中獎的人
          document.getElementById('nameList').value = candidates.join('\n');

          isDrawing = false;
          drawBtn.disabled = false;
        }
      }, 80);
    }

    function clearWinners() {
      if (confirm('確定要清空中獎名單紀錄嗎？')) {
        document.getElementById('winnerList').innerHTML = '';
        document.getElementById('screen').innerText = '準備就緒';
      }
    }
  </script>

</body>
</html>
