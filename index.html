<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>醫生抽獎系統</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 0;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: #fce4ec;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 美化後的四角橢圓橫幅 */
    .banner-container {
      width: calc(100% - 40px);
      max-width: 900px;
      margin: 10px auto 20px;
      border-radius: 28px; /* 四角大圓角/橢圓弧度 */
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(233, 30, 99, 0.15);
      border: 3px solid #ffffff;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
    }
    .banner-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 25px;
    }

    /* 分頁導覽列 */
    .nav-tabs {
      display: flex;
      gap: 15px;
      margin: 10px 0 15px;
    }
    .tab-btn {
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      background-color: #ffffff;
      color: #718096;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      transition: 0.2s;
    }
    .tab-btn.active {
      background-color: #e91e63;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.35);
    }

    /* 主卡片面板 */
    .view-panel {
      display: none;
      background: #ffffff;
      padding: 35px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 900px;
      width: calc(100% - 40px);
      margin-bottom: 40px;
    }
    .view-panel.active { display: block; }

    /* 設定頁面樣式 */
    .setting-title {
      font-size: 20px;
      font-weight: bold;
      color: #e91e63;
      margin-bottom: 12px;
    }
    textarea {
      width: 100%;
      height: 260px;
      border: 2px solid #f8bbd0;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }
    .btn-action {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.2s;
    }
    .btn-action:hover { background-color: #2563eb; }

    /* 抽獎舞台頁面 */
    .stage-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .stage-info {
      font-size: 18px;
      font-weight: bold;
      color: #c2185b;
      margin-bottom: 25px;
    }

    /* 超大滾輪顯示框 */
    .slot-display {
      width: 100%;
      max-width: 700px;
      height: 190px;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 5px solid #e91e63;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 35px rgba(233, 30, 99, 0.25);
      position: relative;
      overflow: hidden;
    }
    .slot-name {
      font-size: 58px;
      font-weight: 900;
      color: #00f2fe;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
      letter-spacing: 2px;
    }

    /* 抽獎按鈕 */
    .btn-spin-large {
      margin-top: 30px;
      background: linear-gradient(135deg, #ff4081, #e91e63);
      color: white;
      border: none;
      padding: 18px 70px;
      border-radius: 40px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(233, 30, 99, 0.35);
      transition: 0.2s;
    }
    .btn-spin-large:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 30px rgba(233, 30, 99, 0.45);
    }
    .btn-spin-large:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 中獎紀錄 */
    .history-card {
      margin-top: 30px;
      width: 100%;
      max-width: 700px;
      background: #fff5f8;
      border-radius: 14px;
      padding: 18px;
      border: 1px solid #f8bbd0;
      text-align: left;
    }
    .history-card h4 { margin: 0 0 10px; color: #c2185b; font-size: 16px; }
    .history-items {
      max-height: 130px;
      overflow-y: auto;
      font-size: 14px;
      color: #334155;
      line-height: 1.8;
    }

    /* 中獎彈窗 */
    .winner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .winner-modal.show { display: flex; }
    .modal-content {
      background: #ffffff;
      padding: 45px 55px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .modal-winner-name {
      font-size: 52px;
      font-weight: 900;
      color: #e91e63;
      margin: 20px 0;
    }
    .modal-close-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 35px;
      font-size: 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 四角微橢圓美化橫幅 -->
  <header class="banner-container">
    <img src="./banner.png" alt="醫生抽獎系統橫幅">
  </header>

  <!-- 分頁切換 -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('stage')">抽獎舞台</button>
    <button class="tab-btn" onclick="switchTab('settings')">名單與設定</button>
  </div>

  <!-- 分頁 1：抽獎舞台 -->
  <div id="stagePanel" class="view-panel active">
    <div class="stage-container">
      <div class="stage-info" id="stageInfo">目前名單：共 500 位</div>

      <div class="slot-display">
        <div class="slot-name" id="slotName">準備抽獎</div>
      </div>

      <button class="btn-spin-large" id="spinBtn" onclick="startHugeLottery()">開始抽獎</button>

      <div class="history-card">
        <h4>中獎紀錄清單</h4>
        <div class="history-items" id="historyList">尚無中獎紀錄</div>
      </div>
    </div>
  </div>

  <!-- 分頁 2：名單設定 -->
  <div id="settingsPanel" class="view-panel">
    <div class="setting-title">參加名單管理</div>
    <p style="color: #666; font-size: 14px; margin-top: -5px;">請在下方輸入抽獎名單，一行一位：</p>
    <textarea id="nameInput"></textarea>
    <br>
    <button class="btn-action" onclick="saveNames()">儲存名單並更新</button>
  </div>

  <!-- 中獎彈窗 -->
  <div class="winner-modal" id="winnerModal">
    <div class="modal-content">
      <h2 style="margin: 0; color: #64748b; font-size: 22px;">恭喜中獎幸運兒</h2>
      <div class="modal-winner-name" id="modalWinner">醫生 88 號</div>
      <button class="modal-close-btn" onclick="closeModal()">確認</button>
    </div>
  </div>

  <script>
    let names = [];
    let isSpinning = false;

    function generateInitial500() {
      let list = [];
      for (let i = 1; i <= 500; i++) {
        list.push(`醫生 ${i} 號`);
      }
      return list.join("\n");
    }

    document.getElementById("nameInput").value = generateInitial500();
    saveNames(false);

    function switchTab(tab) {
      if (isSpinning) return;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));

      if (tab === 'stage') {
        document.querySelectorAll(".tab-btn")[0].classList.add("active");
        document.getElementById("stagePanel").classList.add("active");
      } else {
        document.querySelectorAll(".tab-btn")[1].classList.add("active");
        document.getElementById("settingsPanel").classList.add("active");
      }
    }

    function saveNames(showAlert = true) {
      const text = document.getElementById("nameInput").value.trim();
      names = text.split("\n").map(n => n.trim()).filter(n => n.length > 0);
      document.getElementById("stageInfo").innerText = `目前名單：共 ${names.length} 位`;
      
      if (showAlert) {
        alert(`名單更新成功，目前共有 ${names.length} 位參與抽獎。`);
        switchTab('stage');
      }
    }

    function startHugeLottery() {
      if (isSpinning || names.length === 0) return;

      isSpinning = true;
      const spinBtn = document.getElementById("spinBtn");
      const slotName = document.getElementById("slotName");
      spinBtn.disabled = true;

      let speed = 40;
      let elapsed = 0;
      const totalDuration = 4500;

      const interval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * names.length);
        slotName.innerText = names[randomIndex];
        elapsed += speed;

        if (elapsed > totalDuration - 1500) {
          speed += 25;
        }

        if (elapsed >= totalDuration) {
          clearInterval(interval);
          
          const finalWinner = names[Math.floor(Math.random() * names.length)];
          slotName.innerText = finalWinner;
          
          showWinnerModal(finalWinner);
          recordHistory(finalWinner);

          isSpinning = false;
          spinBtn.disabled = false;
        }
      }, speed);
    }

    function showWinnerModal(winner) {
      document.getElementById("modalWinner").innerText = winner;
      document.getElementById("winnerModal").classList.add("show");
    }

    function closeModal() {
      document.getElementById("winnerModal").classList.remove("show");
    }

    function recordHistory(winner) {
      const historyList = document.getElementById("historyList");
      if (historyList.innerText === "尚無中獎紀錄") {
        historyList.innerHTML = "";
      }
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      historyList.innerHTML = `<div>• [${time}] <b>${winner}</b></div>` + historyList.innerHTML;
    }
  </script>
</body>
</html>
